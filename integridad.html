<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Integridad del registro privado · SIPAC</title><style>body{font:16px Arial;max-width:760px;margin:40px auto;padding:20px;color:#193747}button,input{font:inherit;padding:12px;margin:10px 0;max-width:100%}p{line-height:1.5}code{overflow-wrap:anywhere}section{border:1px solid #ddd;padding:20px;margin:20px 0}</style></head><body><h1>Integridad del registro privado</h1><p>Compara el PDF y los datos con sus huellas SHA-256 publicadas. Esto detecta diferencias respecto de esa referencia; no acredita autenticidad oficial ni sustituye una firma digital.</p><p id="status" role="status">Comprobando…</p><section><p>Folio: <strong id="folio"></strong></p><p>Huella de datos: <code id="digest"></code></p><label>Opcional: comprobar una copia descargada del PDF<input id="file" type="file" accept="application/pdf,.pdf"></label><p id="local" role="status"></p></section><a href="index.html">Volver a la consulta</a><script>
(async()=>{const status=document.getElementById('status');const hash=async b=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',b))).map(x=>x.toString(16).padStart(2,'0')).join('');try{const get=async u=>{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error('No se pudo leer un archivo de comprobación.');return r};const info=await(await get('integridad.json')).json();const pdfUrl=new URL(info.pdfUrl,location.href);if(pdfUrl.origin!==location.origin)throw Error('El PDF debe estar alojado en el mismo dominio.');document.getElementById('folio').textContent=info.number;document.getElementById('digest').textContent=info.dataSha256;document.getElementById('file').onchange=async e=>{const file=e.target.files[0];if(!file)return;const out=document.getElementById('local');if(file.size>20*1024*1024){out.textContent='El archivo supera 20 MB.';return}try{out.textContent=(await hash(await file.arrayBuffer()))===info.pdfSha256?'La copia coincide con el PDF publicado.':'La copia NO coincide con el PDF publicado.'}catch{out.textContent='No se pudo leer el archivo.'}};const data=await(await get('datos-documento.json')).arrayBuffer();const pdf=await(await get(pdfUrl)).arrayBuffer();status.textContent=(await hash(data))===info.dataSha256&&(await hash(pdf))===info.pdfSha256?'Las huellas del PDF y de los datos coinciden con la referencia publicada.':'ADVERTENCIA: los archivos no coinciden con la referencia publicada.'}catch(e){status.textContent='No se pudo completar la comprobación. '+e.message}})();
</script></body></html>
